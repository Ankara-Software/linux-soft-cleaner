[package]
name = "linux-soft-cleaner"
version = "0.1.1"
edition = "2024"
authors = ["Anilcan Kara <anilcan@kara.dev>"]
description = "A fast, safe, and minimal disk cleanup tool for Linux servers — written in Rust"
license = "MIT"
repository = "https://github.com/anilcan-kara/linux-soft-cleaner"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
strip = true
